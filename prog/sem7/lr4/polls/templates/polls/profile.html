<!DOCTYPE html>
<html>
<head>
    <title>Profile - Polls App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'polls/navbar.html' %}

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center">User Profile</h2>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h4>User Information</h4>
                                <p><strong>Username:</strong> {{ user.username }}</p>
                                <p><strong>Email:</strong> {{ user.email }}</p>
                                <p><strong>Joined:</strong> {{ user.date_joined|date:"M d, Y" }}</p>
                                <p><strong>Last Login:</strong> {{ user.last_login|date:"M d, Y H:i" }}</p>
                            </div>
                            <div class="col-md-6">
                                <h4>Quick Actions</h4>
                                <div class="d-grid gap-2">
                                    <a href="{% url 'polls:create_question' %}" class="btn btn-primary">Create New Poll</a>
                                    <a href="{% url 'polls:index' %}" class="btn btn-outline-secondary">View All Polls</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
